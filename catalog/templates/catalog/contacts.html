{% extends "base.html" %}

{% block content %}

{% if success %}
<div class="container">
  <div class="alert alert-success" role="alert">
    {{ success }}
  </div>
</div>
{% endif %}

<div class="container">
  <div class="row text-start">
    <!-- Левая часть: контакты -->
    <div class="col-lg-9 col-md-6 col-sm-12">
      <h2>Контакты</h2>
      <table class="table table-striped">
        <tbody>
          <tr>
            <th>Адрес:</th>
            <td>г. Москва, ул. Примерная, д. 1</td>
          </tr>
          <tr>
            <th>Телефон:</th>
            <td>+7 (900) 123-45-67</td>
          </tr>
          <tr>
            <th>Email:</th>
            <td>info@skystore.ru</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Правая часть: форма -->
    <div class="col-lg-3 col-md-6 col-sm-12">
      <div class="card mb-4 box-shadow">
        <div class="card-header">
          <h4 class="my-0 font-weight-normal">Свяжитесь с нами</h4>
        </div>
        <div class="card-body">
          <form method="post" action="" class="form-floating">
            {% csrf_token %}
            <div class="mb-3">
              <label for="name">Имя</label>
              <input type="text" name="name" class="form-control" id="name" placeholder="Ваше имя" required>
            </div>
            <div class="mb-3">
              <label for="phone">Телефон</label>
              <input type="text" name="phone" class="form-control" id="phone" placeholder="Контактный телефон" required>
            </div>
            <div class="mb-3">
              <label for="message">Сообщение</label>
              <textarea name="message" class="form-control" id="message" rows="3" placeholder="Текст сообщения" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Отправить</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
