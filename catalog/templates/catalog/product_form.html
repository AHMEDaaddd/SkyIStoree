{% extends "base.html" %}

{% block title %}Добавить товар — Skystore{% endblock %}

{% block content %}
<div class="container">
  <h1 class="mb-4">Добавить товар</h1>
  <form method="post" enctype="multipart/form-data" class="row g-3">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
